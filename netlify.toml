# MY DOORS Bestelformulier — Netlify deploy config

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: alle routes → index.html (React rendert client-side).
# 200 statuscode zodat het direct serveert i.p.v. een redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers: PWA-vriendelijk. Service worker mag niet gecached door CDN
# (anders krijgen gebruikers nooit nieuwe versies).
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Assets in /assets/* zijn content-hashed door Vite → immutable cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
